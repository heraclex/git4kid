name: Deploy Pages

# Push to main  -> deploys the live site.
# Run manually  -> Actions tab > "Deploy Pages" > Run workflow > pick any branch.
#                  That branch REPLACES the live site until the next main deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir _site
          cp presentation.html _site/
          cp presentation.html _site/index.html
          cp -r playground _site/
          cp playground.bundle _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "Deployed **${{ github.ref_name }}** (${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deployment.outputs.page_url }}presentation.html" >> "$GITHUB_STEP_SUMMARY"
